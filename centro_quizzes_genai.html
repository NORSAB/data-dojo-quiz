<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centro de quizzes GenAI</title><style>
:root{font-family:Arial,sans-serif;color:#111827;background:#f8fafc}body{margin:0}.app{max-width:880px;margin:auto;padding:24px 16px 48px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dbe2ea;padding-bottom:16px;margin-bottom:20px}h1{font-size:22px;margin:0}.lang button,.btn{font:inherit;background:#fff;border:1px solid #cbd5e1;border-radius:6px;padding:9px 12px;cursor:pointer}.lang button.active,.btn.primary{background:#3157d5;border-color:#3157d5;color:#fff}.menu{display:grid;gap:10px}.exam{display:block;text-align:left;padding:16px;background:#fff;border:1px solid #dbe2ea;border-radius:8px;font:inherit;cursor:pointer}.exam:hover{border-color:#3157d5}.exam b{display:block;font-size:16px}.exam span{color:#52606d;font-size:13px}.search{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;margin:14px 0}.result{padding:12px;background:#fff;border:1px solid #dbe2ea;border-radius:7px;margin:7px 0;cursor:pointer}.result small{color:#3157d5}.hidden{display:none}.back{margin-bottom:15px}.status{color:#52606d;font-size:14px}.card{background:#fff;border:1px solid #d1d5db;border-radius:8px;overflow:hidden}.head{padding:17px 22px;border-bottom:1px solid #e5e7eb}.body{padding:22px}.prompt{white-space:pre-line;line-height:1.65;font-size:16px;margin:0 0 22px}.choice{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;padding:13px;margin:11px 0;background:#fff;border:2px solid #e5e7eb;border-radius:8px;font:inherit;line-height:1.45}.choice.correct{border-color:#d94801;background:#fffaf5}.choice input{margin-top:3px;accent-color:#d94801;width:18px;height:18px}.mark{margin-left:auto;color:#b93800;font-weight:bold}.note{margin-top:20px;padding:13px;border-left:4px solid #3157d5;background:#f5f8ff;line-height:1.5}.nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}.nav button:disabled{opacity:.45}@media(max-width:540px){.app{padding:14px 10px}.body{padding:17px}}
</style></head><body><main class="app"><header class="top"><h1 id="title">Centro de quizzes GenAI</h1><div class="lang"><button class="active" data-lang="en">EN</button><button data-lang="es">ES</button></div></header><section id="menu"><p class="status" id="intro">Selecciona un examen o busca una pregunta.</p><input id="search" class="search" placeholder="Buscar en todos los exámenes…"><div id="searchResults"></div><div class="menu" id="examMenu"></div></section><section id="viewer" class="hidden"><button class="btn back" id="back">← Volver al menú principal</button><div class="status" id="where"></div><article class="card" id="question"></article></section></main><script>
const sources=[['Building RAG Agents with Agent Bricks','Building RAG Agents with Agent Bricks/cuestionario_original_en.txt',20,'raw'],['Building Agentic Applications on Databricks','Building Agentic Applications on Databricks/quiz_interactivo.html',20,'link'],['Evaluación de agentes en Databricks','Evaluacion de agentes en Databricks/quiz_interactivo.html',20,'link'],['Deploying and Monitoring Agent Applications on Databricks','Deploying and Monitoring Agent Applications on Databricks/quiz_interactivo.html',20,'link'],['Get Started with Databricks for Generative AI','Get Started with Databricks for Generative AI/quiz_interactivo.html',20,'link'],['AI Agent Fundamentals Accreditation','AI Agent Fundamentals Accreditation/quiz_interactivo.html',20,'link'],['Generative AI Application Deployment and Monitoring','GENERATIVE AI ENGINEERING/Generative AI Application Deployment and Monitoring/respuestas_cuestionario.md',20,'md'],['Generative AI Application Evaluation and Governance','GENERATIVE AI ENGINEERING/Generative AI Application Evaluation and Governance/respuestas_cuestionario.md',20,'md'],['Building Single-Agent Applications on Databricks','GENERATIVE AI ENGINEERING/Building Single-Agent Applications on Databricks/respuestas_cuestionario.md',20,'md'],['Building Retrieval Agents on Databricks','GENERATIVE AI ENGINEERING/Building Retrieval Agents on Databricks/respuestas_cuestionario.md',20,'md'],['Generative AI Fundamentals Accreditation','GENERATIVE AI ENGINEERING/Generative AI Fundamentals Accreditation/respuestas_cuestionario.md',10,'md']];
let bank=[],active=null,pos=0,lang='en';const clean=s=>(s||'').replace(/\\_/g,'_').replace(/\\\./g,'.').replace(/[*`]/g,'').replace(/\s+/g,' ').trim();const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ragCorrect=['Manage state across turns by summarizing history, pruning irrelevant or stale context, and keeping persistent instructions in the window while staying within the token budget.','Pass the full ai_parse_document VARIANT per document, not the flattened elements, because ai_prep_search transforms the structured parse output into semantic chunks.','Use smaller, focused chunks with modest overlap that fit within the embedding model\'s token limit, improving precision and reducing the lost in the middle effect.','Embed chunk_to_embed for findability from the added context, and give the LLM chunk_to_retrieve as clean original text for accurate generation.','The table must be a streaming table or have Change Data Feed enabled, with a content column (BINARY or STRING) and a metadata struct.','They remove short, low-signal elements so classification and extraction operate on blocks with enough text to be meaningful, and extraction uses a higher bar because it needs more surrounding context.','The value should be serving-endpoints, so the base_url becomes {host}/serving-endpoints.','Recall dropped because query and index embeddings must come from the same model to share a vector space, and cosine similarity ranks chunks by how small the angle is between the query vector and each chunk vector.','The MLflow trace captures the input and output (including retrieved context and the generated answer), and the Knowledge Assistant returns citations back to source documents.','The AI Search index must use a supported Databricks embedding model, such as databricks-gte-large-en, rather than an unsupported third-party model.','The first team should use a Knowledge Assistant (declarative, managed), and the second should build a code-first custom agent for full control.','A base LLM is limited by its training cutoff and has no access to the credit union\'s private, changing documents, so it cannot know current policies and fills gaps by hallucinating.','ext:response.vendor, because ai_extract returns a VARIANT with a response object whose fields match the requested names.','A VARIANT of structured JSON (document elements and pages); the version pins output to the v2.0 schema, which supports descriptions and bounding boxes.','Enable Change Data Feed on the source table, because Delta Sync indexes on standard endpoints require CDF, which lets AI Search process only the changed rows for efficient incremental sync.','Retrieve, Augment, Generate','Compliance: TRIGGERED (sync on demand, cost control for batch); Trading desk: CONTINUOUS (near-real-time freshness at higher compute cost).','variant_explode, which converts a VARIANT array or object into rows exposing pos, key, and value columns.','It is context engineering, a broader discipline that manages the entire input environment, whereas the first engineer is doing prompt engineering, which targets only the instruction text.','Files larger than 50 MB are automatically skipped, so the three oversized manuals were never ingested.'];
const ragCorrectIndex=[3,1,3,0,1,0,2,1,2,3,1,0,3,1,0,1,2,1,0,2];
function rawParse(txt,name,total){return txt.split(/(?=Pregunta \d+ de 20)/).filter(x=>x.startsWith('Pregunta')).map((b,i)=>{let l=b.split('\n').filter(Boolean),p=l.findIndex(x=>/^(Which|What|How|These three)/.test(x)),rest=clean(l.slice(p+1).join(' ')).replace(/\.([A-Z])/g,'. $1').replace('RetrieveGenerate,','Retrieve\nGenerate,'),opts=rest.split(/(?<=\.)\s+(?=[A-Z])|\n(?=[A-Z])/).filter(Boolean);return {exam:name,total,n:i+1,correctIndex:ragCorrectIndex[i],en:{q:l.slice(1,p+1).join('\n'),opts,answer:ragCorrect[i],why:'See the marked option; it is the documented correct answer.'},es:null}})}
function mdParse(txt,name,total){let blocks=txt.split(/(?=^## Question \d+ of \d+|^## Pregunta \d+ de \d+)/m).filter(x=>/^## (Question|Pregunta)/.test(x));return blocks.map((b,i)=>{let en=b.split(/^### Español/m)[0],es=(b.split(/^### Español/m)[1]||''),get=(s,re)=>clean((s.match(re)||[])[1]),ops=s=>[...s.matchAll(/^- \[([ x])\]\s+(.+)$/gm)].map(m=>({text:clean(m[2]),ok:m[1]==='x'}));let eo=ops(en),so=ops(es);return {exam:name,total,n:i+1,en:{q:get(en,/\*\*Question:\*\*\s*([\s\S]*?)(?=\n\n\*\*Options:\*\*)/),opts:eo.map(x=>x.text),answer:(eo.find(x=>x.ok)||{}).text||get(en,/\*\*Correct answer:\*\*\s*([^\n]+)/),why:get(en,/\*\*Justification:\*\*\s*([^\n]+)/)},es:{q:get(es,/\*\*Pregunta:\*\*\s*([\s\S]*?)(?=\n\n\*\*Opciones:\*\*)/),opts:so.map(x=>x.text),answer:(so.find(x=>x.ok)||{}).text||get(es,/\*\*Respuesta correcta:\*\*\s*([^\n]+)/),why:get(es,/\*\*Justificación:\*\*\s*([^\n]+)/)}}})}
async function load(){for(const [name,path,total,type] of sources){if(type==='link')continue;try{let t=await (await fetch(encodeURI(path))).text();bank.push(...(type==='raw'?rawParse(t,name,total):mdParse(t,name,total)))}catch(e){console.warn(name,e)}}menu()}
function menu(){active=null;document.querySelector('#menu').classList.remove('hidden');document.querySelector('#viewer').classList.add('hidden');document.querySelector('#examMenu').innerHTML=sources.map(([n,,c])=>`<button class="exam" data-exam="${esc(n)}"><b>${esc(n)}</b><span>${c} preguntas</span></button>`).join('');document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>{const source=sources.find(([name])=>name===b.dataset.exam);if(source&&source[3]==='link'){location.href=encodeURI(source[1]);return}open(b.dataset.exam,0)});search()}
function search(){let input=document.querySelector('#search');input.oninput=()=>{let v=input.value.toLowerCase().trim();let rows=v?bank.filter(q=>(q.exam+' '+q.en.q+' '+q.en.answer).toLowerCase().includes(v)).slice(0,30):[];document.querySelector('#searchResults').innerHTML=rows.map(q=>`<div class="result" data-hit="${bank.indexOf(q)}"><small>${esc(q.exam)} · ${q.n}/${q.total}</small><br>${esc(q.en.q)}</div>`).join('');document.querySelectorAll('[data-hit]').forEach(x=>x.onclick=()=>{let q=bank[+x.dataset.hit];open(q.exam,q.n-1)})}}
function open(exam,index){active=exam;pos=index;document.querySelector('#menu').classList.add('hidden');document.querySelector('#viewer').classList.remove('hidden');render()}
function render(){let qs=bank.filter(q=>q.exam===active),q=qs[pos],d=(lang==='es'&&q.es&&q.es.q)?q.es:q.en,answer=clean(d.answer);document.querySelector('#where').textContent=`${active} · ${lang==='es'?'Pregunta':'Question'} ${pos+1} ${lang==='es'?'de':'of'} ${qs.length}`;document.querySelector('#question').innerHTML=`<div class="head">${lang==='es'?'Pregunta':'Question'} ${pos+1} ${lang==='es'?'de':'of'} ${qs.length}</div><div class="body"><p class="prompt">${esc(d.q)}</p>${d.opts.map((o,i)=>{const ok=Number.isInteger(q.correctIndex)?i===q.correctIndex:clean(o)===answer;return `<div class="choice ${ok?'correct':''}"><input type="radio" disabled ${ok?'checked':''}><span>${esc(o)}</span>${ok?'<span class="mark">'+(lang==='es'?'Correcta':'Correct')+'</span>':''}</div>`}).join('')}<div class="note"><b>${lang==='es'?'Justificación':'Justification'}:</b> ${esc(d.why||'La opción marcada es la respuesta correcta documentada.')}</div><div class="nav"><button class="btn" id="prev" ${pos===0?'disabled':''}>${lang==='es'?'Anterior':'Previous'}</button><button class="btn primary" id="next" ${pos===qs.length-1?'disabled':''}>${lang==='es'?'Siguiente':'Next'}</button></div></div>`;document.querySelector('#prev').onclick=()=>{pos--;render()};document.querySelector('#next').onclick=()=>{pos++;render()}}
document.querySelector('#back').onclick=menu;document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===b));if(active)render()});load();
</script></body></html>
