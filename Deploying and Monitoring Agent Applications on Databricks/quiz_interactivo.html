<style>:root{--ink:#17212b;--muted:#5c6b78;--line:#d9e0e7;--accent:#3157d5;--ok:#d94801;--soft:#fff3ed}*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:var(--ink);font:16px/1.5 Arial,sans-serif}header{background:#1e252c;color:#fff;padding:20px max(20px,calc((100% - 980px)/2))}.brand{font-size:22px;font-weight:700}.sub{color:#d5dde5;font-size:14px}main{max-width:980px;margin:34px auto;padding:0 18px}.tools{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.tools a{color:var(--accent);font-weight:700;text-decoration:none}.tools input,.tools select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;font:inherit}.tools input{width:min(100%,430px)}.status{color:var(--muted);font-size:14px;margin:10px 0}.card,.empty{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.head{padding:15px 22px;border-bottom:1px solid var(--line);font-weight:700}.body{padding:24px}.q{white-space:pre-line;font-size:17px;margin:0 0 24px}.opts{display:grid;gap:11px}.opt{display:flex;gap:14px;padding:14px;border:2px solid #e1e6ea;border-radius:8px;line-height:1.45}.opt.ok{border-color:var(--ok);background:var(--soft)}.mark{width:20px;height:20px;border:2px solid #52606d;border-radius:50%;flex:none;margin-top:2px}.ok .mark{border-color:var(--ok);background:var(--ok);position:relative}.ok .mark:after{content:"";position:absolute;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;left:5px;top:1px;transform:rotate(45deg)}.why{margin-top:22px;border-left:4px solid var(--ok);background:var(--soft);padding:14px;border-radius:5px}.why strong{display:block}.nav{display:flex;justify-content:space-between;margin-top:20px}.nav button{font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:#fff}.nav .next{background:var(--accent);color:#fff;border-color:var(--accent)}.nav button:disabled{opacity:.4}@media(max-width:560px){main{margin:18px au <link rel="stylesheet" href="../quiz_style.css?v=20260920b"></head><body><header><div class="brand" id="title"></div><div class="sub" id="sub"></div></header><main><div class="tools"><a href="../centro_quizzes_genai.html" id="back"></a><input id="find" type="search"><select id="lang"><option value="es">Español</option><option value="en">English</option></select></div><div id="status" class="status"></div><section id="app"></section></main><script>
const qs=[
{en:["A team just created a new policy_compliance scorer. They want it applied to traces logged last week, then want all future trace data streamed into a Unity Catalog Delta table for SQL dashboards. Which two capabilities address these goals, respectively?",["Trace archival for both, since archived tables are automatically scored","Metric backfill (`backfill_scorers`) for scoring last week's traces, and trace archival (`enable_databricks_trace_archival`) for streaming traces to a Delta table","Metric backfill for both goals, since it handles history and streaming","Trace archival for historical scoring, and metric backfill for Delta streaming"],1,"Metric backfill scores existing historical traces; trace archival streams trace data into Delta tables for durable SQL analysis."],es:["Un equipo creó un scorer `policy_compliance`. Quiere aplicarlo a trazas de la semana pasada y luego transmitir las trazas futuras a una tabla Delta de Unity Catalog para dashboards SQL. ¿Qué capacidades resuelven esos objetivos, respectivamente?",["Archivado de trazas para ambos objetivos","Metric backfill (`backfill_scorers`) para puntuar trazas históricas y trace archival (`enable_databricks_trace_archival`) para transmitir trazas a Delta","Metric backfill para ambos objetivos","Trace archival para puntuar el histórico y metric backfill para Delta"],1,"Metric backfill puntúa trazas históricas; trace archival transmite los datos de trazas a tablas Delta." ]},
{en:["A data analyst has ALL_PRIVILEGES on the schema and tables holding UC-backed agent traces but still cannot read them. What is the likely explanation?",["They also need OWNER on the experiment","ALL_PRIVILEGES cannot be granted on Delta tables","ALL_PRIVILEGES is not sufficient: grant MODIFY and SELECT explicitly, plus USE_CATALOG and USE_SCHEMA","Trace tables can only be read by their creator service principal"],2,"UC trace tables require explicit MODIFY and SELECT together with USE_CATALOG and USE_SCHEMA; ALL_PRIVILEGES is insufficient."],es:["Un analista tiene ALL_PRIVILEGES sobre el esquema y tablas de trazas UC, pero no puede leerlas. ¿Cuál es la explicación más probable?",["También necesita OWNER del experimento","ALL_PRIVILEGES no se puede conceder en tablas Delta","ALL_PRIVILEGES no basta: otorgue MODIFY y SELECT explícitamente, además de USE_CATALOG y USE_SCHEMA","Solo puede leerlas el service principal que las creó"],2,"Las tablas de trazas UC requieren MODIFY y SELECT explícitos, además de USE_CATALOG y USE_SCHEMA." ]},
{en:["An engineer calls `safety.stop()` during maintenance, but the scorer keeps evaluating traces. What went wrong?",["Set sample rate to 0 in the same call","Lifecycle methods return a new instance, so reassign: `safety = safety.stop()`","stop() works only for UI-created judges","A scorer cannot be stopped"],1,"Lifecycle operations return an updated scorer object. Reassign the result of `stop()`."],es:["Un ingeniero llama `safety.stop()` durante mantenimiento, pero el scorer sigue evaluando trazas. ¿Qué falló?",["Debe fijar sample rate en 0","Los métodos de ciclo de vida devuelven una instancia nueva: `safety = safety.stop()`","stop() solo funciona para jueces creados en la UI","No se puede detener un scorer"],1,"Las operaciones de ciclo de vida devuelven un objeto actualizado; hay que reasignar el resultado de `stop()`." ]},
{en:["A single-turn safety scorer says each response is fine, but users repeatedly rephrase the same question before giving up. Which automated signal surfaces this session-level problem?",["A character-count custom scorer","Lower the single-turn scorer sample rate","A multi-turn judge such as UserFrustration, which evaluates the whole conversation grouped by session","A stricter model override for Safety"],2,"User frustration is a multi-turn concern: the judge evaluates the conversation grouped by session."],es:["Un scorer Safety de un turno indica que cada respuesta está bien, pero usuarios reformulan varias veces antes de abandonar. ¿Qué señal automática muestra este problema de sesión?",["Un scorer que cuenta caracteres","Bajar el muestreo del scorer de un turno","Un juez multi-turn como UserFrustration, que evalúa la conversación completa agrupada por sesión","Un modelo más estricto para Safety"],2,"La frustración es un problema multi-turn; el juez evalúa la conversación agrupada por sesión." ]},
{en:["Agent code reads `SERVING_ENDPOINT` and `MLFLOW_EXPERIMENT_NAME` from `os.environ` so it runs unchanged in dev and prod. How do these values reach a Databricks App?",["They are hardcoded in pyproject.toml","They are injected as environment variables, declared in databricks.yml and surfaced through the app.yaml env section","They are read from a committed .env file","They are command-line arguments to deploy"],1,"Databricks Apps receives configured environment variables through the bundle and app environment configuration."],es:["El código lee `SERVING_ENDPOINT` y `MLFLOW_EXPERIMENT_NAME` de `os.environ` para ejecutarse igual en dev y prod. ¿Cómo llegan a una Databricks App?",["Se codifican en pyproject.toml","Se inyectan como variables de entorno, declaradas en databricks.yml y expuestas mediante la sección env de app.yaml","Se leen de un .env versionado","Son argumentos de línea de comandos"],1,"Las Apps reciben variables de entorno configuradas mediante el bundle y la configuración de la aplicación." ]},
{en:["Which filter pair correctly finds failed and unusually slow requests with `mlflow.search_traces`?",["A: trace.state = failed; B: trace.latency = slow","A: WHERE status = 'ERROR'; B: WHERE time > 5000","A: status == ERROR; B: duration > 5s","A: trace.status = 'ERROR'; B: trace.execution_time_ms > 5000"],3,"Trace search uses trace fields and valid filter expressions; status and execution time identify failed and slow traces."],es:["¿Qué par de filtros encuentra solicitudes fallidas y excepcionalmente lentas con `mlflow.search_traces`?",["A: trace.state = failed; B: trace.latency = slow","A: WHERE status = 'ERROR'; B: WHERE time > 5000","A: status == ERROR; B: duration > 5s","A: trace.status = 'ERROR'; B: trace.execution_time_ms > 5000"],3,"La búsqueda usa campos de trazas y expresiones válidas; estado y tiempo de ejecución identifican fallas y lentitud." ]},
{en:["Which sequence correctly lists the four stages of the agent lifecycle on Databricks?",["Monitoring, Evaluation, Deployment, Observability","Observability, Deployment, Monitoring, Evaluation","Evaluation, Deployment, Monitoring, Observability","Deployment, Observability, Evaluation, Monitoring"],3,"After deployment, agents need observability, evaluation, and ongoing monitoring."],es:["¿Qué secuencia lista correctamente las cuatro etapas del ciclo de vida de agentes en Databricks?",["Monitoring, Evaluation, Deployment, Observability","Observability, Deployment, Monitoring, Evaluation","Evaluation, Deployment, Monitoring, Observability","Deployment, Observability, Evaluation, Monitoring"],3,"Después del despliegue, los agentes requieren observabilidad, evaluación y monitoreo continuo." ]},
{en:["A Declarative Automation Bundle created and updated a Databricks App resource, but its latest source code is not live. What must the developer do?",["Register the agent in Unity Catalog","Run `databricks apps deploy <app-name>` to deploy the application source code","Re-run `databricks bundle deploy`, which also pushes source automatically","Restart the serving endpoint"],1,"Bundle deployment configures resources; `databricks apps deploy` pushes the running app source."],es:["Un Bundle creó y actualizó el recurso de una Databricks App, pero el código fuente más reciente no está activo. ¿Qué debe hacer?",["Registrar el agente en Unity Catalog","Ejecutar `databricks apps deploy <app-name>` para desplegar el código fuente","Reejecutar `databricks bundle deploy`, que sube el código automáticamente","Reiniciar el endpoint de serving"],1,"El bundle configura recursos; `databricks apps deploy` publica el código de la aplicación en ejecución." ]},
{en:["A developer registers a custom function scorer for production monitoring that counts how many times a keyword appears, but the monitoring job fails to run it remotely:\n\nfrom mlflow.genai.scorers import scorer\n\nimport re  # module-level import\n\n@scorer\n\ndef keyword_hits(outputs):\n    text = str(outputs.get(\"response\", \"\"))\n    return len(re.findall(r\"refund\", text))\n\nWhat is the problem, and how should it be fixed?",["The import must move inside the function body, because the scorer is serialized for remote execution and must be fully self-contained","re is not allowed in scorers, only string methods can be used","The scorer must be a subclass of Scorer to run in production","@scorer cannot return integers, so wrap the count in a string"],0,"Production scorers are serialized for remote execution; put external imports inside the function."],es:["Un desarrollador registra un scorer de función personalizado para monitoreo de producción que cuenta cuántas veces aparece una palabra clave, pero el trabajo de monitoreo no puede ejecutarlo remotamente:\n\nfrom mlflow.genai.scorers import scorer\n\nimport re  # importación a nivel de módulo\n\n@scorer\n\ndef keyword_hits(outputs):\n    text = str(outputs.get(\"response\", \"\"))\n    return len(re.findall(r\"refund\", text))\n\n¿Cuál es el problema y cómo debe corregirse?",["La importación debe moverse dentro del cuerpo de la función, porque el scorer se serializa para ejecución remota y debe ser completamente autosuficiente","re no está permitido en scorers; solo se pueden usar métodos de cadenas","El scorer debe ser una subclase de Scorer para ejecutarse en producción","@scorer no puede devolver enteros; envuelva el conteo en una cadena"],0,"Los scorers de producción se serializan para ejecución remota; los imports externos van dentro de la función." ]},
{en:["What is the production value of setting `user_id`, `session_id`, and `app_version` on an active span?",["They replace MLflow experiment logging","They cache responses","They let engineers filter and group traces by user, session, and app version when debugging","They automatically enable Safety"],2,"Span attributes make traces searchable and groupable for release and user-level debugging."],es:["¿Cuál es el valor en producción de fijar `user_id`, `session_id` y `app_version` en un span activo?",["Sustituyen el logging de MLflow","Cachean respuestas","Permiten filtrar y agrupar trazas por usuario, sesión y versión de la app al depurar","Habilitan Safety automáticamente"],2,"Los atributos vuelven las trazas buscables y agrupables para depurar por usuario, sesión y versión." ]},
{en:["A new Unity Catalog refund function is registered on an MCP server after an app has been deployed. Why can the app use it without redeployment?",["All tools are cached at build time","Tools are discovered at runtime via tools/list rather than hardcoded into the agent","The service principal is recreated","The MCP client rewrites source code"],1,"MCP clients discover the server's current tools at runtime through the tools/list protocol."],es:["Se registra una nueva función UC de reembolsos en un servidor MCP después de desplegar la app. ¿Por qué puede usarla sin redesplegar?",["Las herramientas se almacenan en caché al compilar","Las herramientas se descubren en tiempo de ejecución mediante tools/list, no están codificadas en el agente","Se recrea el service principal","El cliente MCP reescribe el código"],1,"Los clientes MCP descubren las herramientas actuales del servidor en ejecución mediante tools/list." ]},
{en:["A medical-coding agent has ground-truth answers and also needs to flag unsafe responses without reference answers. Which built-in judges fit, respectively?",["Safety; Correctness","Correctness; Safety","RelevanceToQuery for both","RetrievalSufficiency; Guidelines"],1,"Correctness compares against ground truth; Safety evaluates unsafe content without a reference answer."],es:["Un agente de codificación médica tiene respuestas ground truth y además debe señalar respuestas inseguras sin referencias. ¿Qué jueces integrados corresponden, respectivamente?",["Safety; Correctness","Correctness; Safety","RelevanceToQuery para ambos","RetrievalSufficiency; Guidelines"],1,"Correctness compara contra ground truth; Safety evalúa contenido inseguro sin respuesta de referencia." ]},
{en:["An MLflow experiment is bound to a Unity Catalog trace location with table prefix `agent_traces`. Which tables are created automatically?",["agent_traces_requests and agent_traces_responses","agent_traces_input, agent_traces_output, and agent_traces_errors","One agent_traces table","agent_traces_otel_spans, agent_traces_otel_annotations, agent_traces_otel_logs, and agent_traces_otel_metrics"],3,"UC trace ingestion creates OpenTelemetry-backed spans, annotations, logs, and metrics tables with the configured prefix."],es:["Un experimento MLflow se vincula a una ubicación de trazas UC con prefijo `agent_traces`. ¿Qué tablas se crean automáticamente?",["agent_traces_requests y agent_traces_responses","agent_traces_input, agent_traces_output y agent_traces_errors","Una sola tabla agent_traces","agent_traces_otel_spans, agent_traces_otel_annotations, agent_traces_otel_logs y agent_traces_otel_metrics"],3,"La ingesta UC crea tablas OpenTelemetry de spans, anotaciones, logs y métricas con el prefijo configurado." ]},
{en:["A compliance team registers a Guidelines scorer that requires Spanish responses. What value does this judge return for each evaluated trace?",["A Python boolean","A float 0.0–1.0","The translated Spanish response text","Feedback with a value of 'yes' or 'no' strings, one per guideline"],3,"Guidelines produces Feedback assessments with categorical yes/no values for each rule."],es:["Un equipo registra un scorer Guidelines que exige respuestas en español. ¿Qué valor devuelve por cada traza evaluada?",["Un booleano Python","Un puntaje flotante 0.0–1.0","El texto traducido","Feedback con valor de cadenas 'yes' o 'no', uno por guía"],3,"Guidelines produce assessments Feedback categóricos yes/no para cada regla." ]},
{en:["A root travel_agent span is CHAIN, lookup_weather is TOOL, and `mlflow.openai.autolog()` is enabled. What trace results?",["Two unrelated traces","Only a CHAT_MODEL span","A parent CHAIN span for travel_agent, child TOOL span for lookup_weather, and an automatically generated CHAT_MODEL span for the OpenAI call","One flat childless span"],2,"Manual parent/child spans nest with the CHAT_MODEL span generated by OpenAI autologging."],es:["Un span raíz travel_agent es CHAIN, lookup_weather es TOOL y `mlflow.openai.autolog()` está habilitado. ¿Qué traza resulta?",["Dos trazas no relacionadas","Solo un span CHAT_MODEL","Un span CHAIN padre para travel_agent, TOOL hijo para lookup_weather y un CHAT_MODEL generado automáticamente para la llamada OpenAI","Un span plano sin hijos"],2,"Los spans manuales padre/hijo se anidan con el CHAT_MODEL que crea autologging." ]},
{en:["A Python pricing function registered in Unity Catalog is discovered and invoked as an agent tool with no custom wrapper. Which MCP server category is used?",["A managed MCP server backed by Unity Catalog functions","A custom MCP server hosted as a Databricks App","A local MCP server in the container","An external SaaS MCP server"],0,"Databricks exposes registered Unity Catalog functions through a managed MCP server."],es:["Una función Python de precios registrada en Unity Catalog se descubre e invoca como herramienta sin wrapper. ¿Qué categoría de servidor MCP se usa?",["Un servidor MCP administrado respaldado por funciones Unity Catalog","Un servidor MCP personalizado como Databricks App","Un servidor MCP local en el contenedor","Un servidor MCP externo SaaS"],0,"Databricks expone funciones UC registradas mediante un servidor MCP administrado." ]},
{en:["A multi-turn judge never groups chat turns although `mlflow.trace.session` was set as a tag. What fixes it?",["Set the session id in trace metadata, for example via `session_id=` or the `mlflow.trace.session` metadata key, not in tags","Set session completion buffer to zero","Put it in both a tag and span name","Give traces the same trace_id"],0,"Multi-turn grouping reads session information from trace metadata, not tags."],es:["Un juez multi-turn no agrupa los turnos aunque `mlflow.trace.session` se fijó como tag. ¿Cómo se corrige?",["Fijar el id de sesión en metadatos de la traza, por ejemplo mediante `session_id=` o la clave de metadatos `mlflow.trace.session`, no en tags","Fijar el buffer de finalización en cero","Ponerlo también en el nombre del span","Dar el mismo trace_id"],0,"La agrupación multi-turn lee la sesión desde metadatos, no desde tags." ]},
{en:["In the app-based Databricks App pattern, what is deployed as the artifact?",["A foundation model on app compute","A SQL warehouse","A registered MLflow model in Unity Catalog","The application code, which calls a serving endpoint for inference"],3,"The app owns orchestration and tool logic; it calls a serving endpoint only for model inference."],es:["En el patrón basado en Databricks App, ¿qué se despliega como artefacto?",["Un foundation model en cómputo de la app","Un SQL warehouse","Un modelo MLflow registrado en Unity Catalog","El código de la aplicación, que llama a un endpoint de serving para inferencia"],3,"La app posee la orquestación y lógica de herramientas; llama al endpoint solo para inferencia." ]},
{en:["A high-traffic agent must never miss safety violations, needs a meaningful quality read from an expensive LLM judge, and must control cost. Which sampling strategy fits?",["Every scorer at 100%","Safety at 100% and the expensive LLM quality judge at roughly 5–10%","Safety at 5% and quality at 100%","All scorers at 50%"],1,"Safety warrants full coverage; costly quality monitoring can be sampled while retaining a meaningful signal."],es:["Un agente de alto tráfico no puede perder violaciones de seguridad, necesita una lectura significativa de calidad con un juez LLM costoso y debe controlar gasto. ¿Qué muestreo encaja?",["Todos los scorers al 100%","Safety al 100% y el juez LLM costoso aproximadamente al 5–10%","Safety al 5% y calidad al 100%","Todos al 50%"],1,"Safety requiere cobertura total; la calidad costosa se puede muestrear manteniendo una señal útil." ]},
{en:["Which Databricks component centrally enforces content guardrails, rate limits, and spend tracking across LLM endpoints without editing agent code?",["Model Context Protocol server","Declarative Automation Bundle","Unity AI Gateway","MLflow Experiment"],2,"Unity AI Gateway is the centralized layer between applications and serving endpoints for governance, limits, and usage control."],es:["¿Qué componente Databricks aplica centralmente guardrails de contenido, rate limits y seguimiento de gasto en endpoints LLM sin editar código de agentes?",["Servidor Model Context Protocol","Declarative Automation Bundle","Unity AI Gateway","Experimento MLflow"],2,"Unity AI Gateway es la capa centralizada entre aplicaciones y endpoints para gobierno, límites y control de uso." ]}
];const tx={es:{t:"Deploy y monitoreo de aplicaciones agénticas en Databricks",s:"Examen documentado: 20 preguntas",b:"Volver al Centro de exámenes",p:"Buscar en las 20 preguntas",q:"Pregunta",of:"de",a:"Respuesta correcta",j:"Justificación",pr:"Anterior",nx:"Siguiente",no:"No hay coincidencias."},en:{t:"Deploying and Monitoring Agent Applications on Databricks",s:"Documented exam: 20 questions",b:"Back to Exam Center",p:"Search across 20 questions",q:"Question",of:"of",a:"Correct answer",j:"Justification",pr:"Previous",nx:"Next",no:"No matches found."}};let l="es",v=qs.map((_,i)=>i),n=0;const $=x=>document.querySelector(x),e=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));function render(){let t=tx[l],i=v[n];$("#title").textContent=t.t;$("#sub").textContent=t.s;$("#back").textContent=t.b;$("#find").placeholder=t.p;if(i===undefined){$("#app").innerHTML=`<div class="empty">${t.no}</div>`;return}
let x=l==='en'&&window.literalEn?[window.literalEn[i][0],window.literalEn[i][1],window.literalEn[i][2],qs[i].en[3]]:l==='es'&&window.literalEs?[window.literalEs[i][0],window.literalEs[i][1],window.literalEs[i][2],qs[i].es[3]]:qs[i][l];
$("#status").textContent=`${v.length} / ${qs.length}`;$("#app").innerHTML=`<article class="card"><div class="head">${t.q} ${i+1} ${t.of} ${qs.length}</div><div class="body"><p class="q">${e(x[0])}</p><div class="opts">${x[1].map((o,k)=>`<div class="opt ${k===x[2]?"ok":""}"><span class="mark"></span><span>${e(o)}</span></div>`).join("")}</div><div class="why"><strong>${t.a}</strong>${e(x[1][x[2]])}<strong style="margin-top:9px">${t.j}</strong>${e(x[3])}</div><div class="nav"><button id="pr" ${n===0?"disabled":""}>${t.pr}</button><button id="nx" class="next" ${n===v.length-1?"disabled":""}>${t.nx}</button></div></div></article>`;$("#pr").onclick=()=>{n--;render()};$("#nx").onclick=()=>{n++;render()}}$("#lang").onchange=z=>{l=z.target.value;render()};$("#find").oninput=z=>{let s=z.target.value.toLowerCase();v=qs.map((q,i)=>({q,i})).filter(({q})=>!s||q.en.flat().join(" ").toLowerCase().includes(s)||q.es.flat().join(" ").toLowerCase().includes(s)).map(x=>x.i);n=0;render()};render();</script></body></html>
