<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get Started with Databricks for Generative AI</title><script src="questions_en.js"></script><script src="questions_es.js"></script><style>:root{--ink:#17212b;--muted:#5c6b78;--line:#d9e0e7;--accent:#3157d5;--ok:#087443;--soft:#f6f8fa}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.5 Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:18px max(24px,calc((100% - 1040px)/2));display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0;flex:1}.controls{display:flex;gap:8px}button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 13px;cursor:pointer}button:hover,button.active{border-color:var(--accent);color:var(--accent)}main{max-width:920px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.top{padding:16px 22px;border-bottom:1px solid var(--line);font-weight:700}.content{padding:26px 28px}.question{white-space:pre-line;margin:0 0 25px}.options{display:grid;gap:12px}.option{width:100%;text-align:left;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}.letter{flex:0 0 26px;height:26px;border:2px solid #526170;border-radius:50%;display:grid;place-items:center;font-size:13px}.option.correct{border-color:var(--ok);background:#f0faf5}.option.correct .letter{border-color:var(--ok);color:var(--ok)}.note{margin-top:20px;color:var(--muted);font-size:14px}.nav{display:flex;justify-content:space-between;margin-top:18px}.empty{padding:30px;color:var(--muted)}@media(max-width:620px){header{padding:14px 16px}.content{padding:20px 16px}h1{font-size:18px}}</style><link rel="stylesheet" href="../quiz_style.css?v=20260920b"></head><body><header><h1>Get Started with Databricks for Generative AI</h1><div class="controls"><button id="es" class="active">Español</button><button id="en">English</button><button id="back">Centro</button></div></header><main><div id="app"></div><div class="nav"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div></main><script>let index=0,lang="es";const $=s=>document.querySelector(s);function render(){const data=lang==="es"?window.questionsEs:window.questionsEn,q=data[index];if(!q){$("#app").innerHTML="<div class='empty'>No hay preguntas disponibles.</div>";return}const labels=["A","B","C","D"],head=lang==="es"?"Pregunta "+(index+1)+" de "+data.length:"Question "+(index+1)+" of "+data.length;const ops=q[1].map((x,n)=>"<button class='option "+(n===q[2]?"correct":"")+"'><span class='letter'>"+labels[n]+"</span><span>"+x+"</span></button>").join("");$("#app").innerHTML="<article class='card'><div class='top'>"+head+"</div><div class='content'><p class='question'>"+q[0]+"</p><div class='options'>"+ops+"</div><p class='note'>"+(lang==="es"?"La opción marcada es la respuesta correcta.":"The marked option is the correct answer.")+"</p></div></article>";$("#prev").disabled=index===0;$("#next").disabled=index===data.length-1;$("#es").classList.toggle("active",lang==="es");$("#en").classList.toggle("active",lang==="en")}$("#es").onclick=()=>{lang="es";render()};$("#en").onclick=()=>{lang="en";render()};$("#prev").onclick=()=>{if(index){index--;render()}};$("#next").onclick=()=>{const d=lang==="es"?window.questionsEs:window.questionsEn;if(index<d.length-1){index++;render()}};$("#back").onclick=()=>location.href="../centro_quizzes_genai.html";render();</script></body></html>
