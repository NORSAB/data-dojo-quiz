<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Agent Fundamentals Accreditation</title><link rel="stylesheet" href="../quiz_style.css?v=20260920b"><script src="questions_en.js"></script><script src="questions_es.js"></script></head><body><header><h1>AI Agent Fundamentals Accreditation</h1><div class="controls"><button id="es" class="active">Español</button><button id="en">English</button><button id="back">Centro</button></div></header><main><div id="app"></div><div class="nav"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div></main><script>let index=0,lang="es";const $=s=>document.querySelector(s);function render(){const data=lang==="es"?window.questionsEs:window.questionsEn,q=data[index];const labels=["A","B","C","D"],head=lang==="es"?"Pregunta "+(index+1)+" de "+data.length:"Question "+(index+1)+" of "+data.length;const ops=q[1].map((x,n)=>"<button class='option "+(n===q[2]?"correct":"")+"'><span class='letter'>"+labels[n]+"</span><span>"+x+"</span></button>").join("");$("#app").innerHTML="<article class='card'><div class='head'>"+head+"</div><div class='content'><p class='question'>"+q[0]+"</p><div class='options'>"+ops+"</div><p class='note'>"+(lang==="es"?"La opción marcada es la respuesta correcta.":"The marked option is the correct answer.")+"</p></div></article>";$("#prev").disabled=index===0;$("#next").disabled=index===data.length-1;$("#es").classList.toggle("active",lang==="es");$("#en").classList.toggle("active",lang==="en")}$("#es").onclick=()=>{lang="es";render()};$("#en").onclick=()=>{lang="en";render()};$("#prev").onclick=()=>{if(index){index--;render()}};$("#next").onclick=()=>{const d=lang==="es"?window.questionsEs:window.questionsEn;if(index<d.length-1){index++;render()}};$("#back").onclick=()=>location.href="../centro_quizzes_genai.html";render();</script></body></html>
