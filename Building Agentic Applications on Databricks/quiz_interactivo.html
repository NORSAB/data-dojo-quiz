  <header class="banner"><div><h1>Quiz · Building Agentic Applications on Databricks</h1><p id="subtitle">7 documented questions of the 20-question exam</p></div><div class="lang"><button class="active" data-lang="en">EN</button><button data-lang="es">ES</button></div></header>
  <main class="app"><div class="toolbar"><a href="../centro_quizzes_genai.html" id="back">← Back to quiz center</a><input class="search" id="search" placeholder="Search the 7 recorded questions…"></div><div class="matches" id="matches"></div><p class="status" id="status"></p><section class="card" id="quiz"></section></main>
  <script>
    const data=[
      {en:{q:'With mlflow.openai.autolog() enabled, a developer runs a supervisor that hands off to a worker, then calls a tool. In the MLflow UI they see several separate, fragmented traces instead of one connected view of the orchestration.\n\nWhat technique produces a single unified trace tree?',o:['Register the agents to Unity Catalog, which automatically merges traces.',"Increase the model's max tokens so all steps fit in one response.",'Disable autologging so only one trace is produced.','Wrap the entire multi-agent flow in a parent function decorated with @mlflow.trace, so the routing, worker LLM calls, and tool calls nest as child spans under one root.'],a:3,w:'The explicit parent trace supplies the root span that links the orchestration and its child spans into one trace tree.'},es:{q:'Con mlflow.openai.autolog() habilitado, un desarrollador ejecuta un supervisor que delega en un trabajador y después llama una herramienta. En MLflow observa varias trazas separadas y fragmentadas, no una vista conectada de la orquestación.\n\n¿Qué técnica genera un único árbol de trazas unificado?',o:['Registrar los agentes en Unity Catalog, que fusiona automáticamente las trazas.','Aumentar el máximo de tokens del modelo para que todos los pasos quepan en una respuesta.','Deshabilitar el autologging para que se produzca una sola traza.','Envolver todo el flujo multiagente en una función padre decorada con @mlflow.trace, para que el enrutamiento, las llamadas LLM del trabajador y las llamadas a herramientas queden anidadas como spans hijos bajo una misma raíz.'],a:3,w:'La traza padre proporciona el span raíz que enlaza la orquestación y sus spans hijos en un único árbol.'}},
      {en:{q:"A team maintains two agents: one built with the OpenAI Agents SDK and one built with LangChain using LangGraph's create_react_agent. They want MLflow to automatically capture execution traces for each.\n\nWhich autologging calls are correct for each framework?",o:['Autologging is not available for either framework; you must log spans manually.','Use mlflow.langchain.autolog() for both agents.','Use mlflow.openai.autolog() for the OpenAI Agents SDK agent and mlflow.langchain.autolog() for the LangChain/LangGraph agent.','Use mlflow.openai.autolog() for both agents.'],a:2,w:'MLflow integrations are framework-specific: OpenAI Agents SDK uses the OpenAI integration, while LangChain and LangGraph use the LangChain integration.'},es:{q:'Un equipo mantiene dos agentes: uno construido con OpenAI Agents SDK y otro con LangChain usando create_react_agent de LangGraph. Desean que MLflow capture automáticamente las trazas de ejecución de cada uno.\n\n¿Qué llamadas de autologging son correctas para cada framework?',o:['El autologging no está disponible para ninguno de los dos frameworks; se deben registrar los spans manualmente.','Usar mlflow.langchain.autolog() para ambos agentes.','Usar mlflow.openai.autolog() para el agente de OpenAI Agents SDK y mlflow.langchain.autolog() para el agente de LangChain/LangGraph.','Usar mlflow.openai.autolog() para ambos agentes.'],a:2,w:'Las integraciones de MLflow son específicas por framework: OpenAI Agents SDK usa la integración OpenAI, mientras LangChain y LangGraph usan la integración LangChain.'}},
      {en:{q:'A security reviewer at a bank worries that exposing Unity Catalog functions to agents through managed MCP servers could let users reach data they are not authorized to see.\n\nWhich statement correctly describes how access is governed?',o:['MCP disables Unity Catalog governance and relies on a shared service account for all calls.','Once a function is exposed through MCP, any user of the agent can call it regardless of their permissions.',"Access is controlled only by the agent's system prompt instructions.",'Unity Catalog permissions remain enforced through the MCP server, so agents and users can only access the tools and data they have been granted.'],a:3,w:'MCP exposes a governed integration path; it does not bypass Unity Catalog authorization on the underlying functions and data.'},es:{q:'Un revisor de seguridad en un banco teme que exponer funciones de Unity Catalog a agentes mediante servidores MCP administrados permita a usuarios llegar a datos para los que no están autorizados.\n\n¿Qué afirmación describe correctamente cómo se gobierna el acceso?',o:['MCP deshabilita la gobernanza de Unity Catalog y se apoya en una cuenta de servicio compartida para todas las llamadas.','Cuando una función se expone mediante MCP, cualquier usuario del agente puede invocarla sin importar sus permisos.','El acceso se controla únicamente mediante las instrucciones del system prompt del agente.','Los permisos de Unity Catalog continúan aplicándose mediante el servidor MCP; los agentes y usuarios solo pueden acceder a las herramientas y datos que se les hayan concedido.'],a:3,w:'MCP expone una ruta de integración gobernada; no evita la autorización de Unity Catalog sobre las funciones y los datos subyacentes.'}},
      {en:{q:'After a supervisor hands off a query to a worker, a developer inspects the run and wants to confirm which agent actually produced the final answer.\n\nresult = await Runner.run(supervisor, "Is $200/night a good deal in the city?")\nprint(result.last_agent.name)\n\nWhat will result.last_agent.name show, and why?',o:['A random agent, because handoff selection is nondeterministic and untracked.','The worker that received the handoff, because once a handoff occurs the worker takes over the conversation and produces the final response.','Always the supervisor, because the supervisor post-processes every worker response.','The MCP server name, because tools own the conversation after a handoff.'],a:1,w:'After a successful handoff, the delegated worker is the final active agent; last_agent identifies that worker.'},es:{q:'Después de que un supervisor delega una consulta en un trabajador, un desarrollador inspecciona la ejecución y quiere confirmar qué agente produjo realmente la respuesta final.\n\nresult = await Runner.run(supervisor, "Is $200/night a good deal in the city?")\nprint(result.last_agent.name)\n\n¿Qué mostrará result.last_agent.name y por qué?',o:['Un agente aleatorio, porque la selección de delegación no es determinista ni se registra.','El trabajador que recibió la delegación, porque cuando ocurre la delegación ese trabajador toma la conversación y genera la respuesta final.','Siempre el supervisor, porque el supervisor procesa posteriormente toda respuesta del trabajador.','El nombre del servidor MCP, porque las herramientas poseen la conversación después de una delegación.'],a:1,w:'Después de una delegación exitosa, el trabajador delegado es el agente activo final; last_agent identifica a ese trabajador.'}},
      {en:{q:'An engineering team runs a single agent that has grown to roughly 20 tools spanning finance, HR, and IT support. They observe frequent tool-selection errors, the system prompt has become long and self-conflicting, and three different teams now need to own their own tools and evolve them independently.\n\nWhat is the most appropriate next step?',o:['Keep one agent and make the system prompt even longer and more detailed to resolve the conflicts.','Decompose into a multi-agent system with specialized worker agents per domain coordinated by a supervisor, so each has focused tools and instructions and teams can own their agents independently.','Keep one agent but remove most of its tools so only a few remain, dropping the finance and HR capabilities.','Replace the agent with a fine-tuned model so tool selection is no longer needed.'],a:1,w:'Domain workers reduce tool ambiguity and permit independent ownership; the supervisor routes each request to the appropriate specialist.'},es:{q:'Un equipo de ingeniería opera un solo agente que ha crecido hasta tener aproximadamente 20 herramientas de finanzas, RR. HH. y soporte de TI. Observan errores frecuentes al elegir herramientas, el system prompt se volvió largo y contradictorio, y tres equipos distintos necesitan ser propietarios de sus herramientas y evolucionarlas de manera independiente.\n\n¿Cuál es el siguiente paso más apropiado?',o:['Mantener un agente y hacer el system prompt aún más largo y detallado para resolver los conflictos.','Descomponer el sistema en varios agentes, con trabajadores especializados por dominio coordinados por un supervisor, de modo que cada uno tenga herramientas e instrucciones enfocadas y los equipos puedan administrar sus agentes de forma independiente.','Mantener un agente, pero eliminar la mayoría de sus herramientas para que queden solo unas pocas, perdiendo las capacidades de finanzas y RR. HH.','Sustituir el agente por un modelo fine-tuned para que ya no sea necesaria la selección de herramientas.'],a:1,w:'Los trabajadores por dominio reducen la ambigüedad de herramientas y permiten propiedad independiente; el supervisor enruta cada solicitud al especialista adecuado.'}},
      {en:{q:'An enterprise wants one system that answers questions spanning several domains: structured analytics via a Genie space, document Q&A via a Knowledge Assistant endpoint, and a deterministic lookup via a Unity Catalog function. It must route each request to the right specialist and must never return results from a subagent a given user is not permitted to access.\n\nWhich approach best fits, and what governs access?',o:['A Multi-Agent Supervisor that coordinates the Genie space, Knowledge Assistant endpoint, and UC function as subagents, routing by intent while enforcing per-user access so users only get results from subagents they can access.','A sequential chain that always calls all three subagents in a fixed order regardless of the question.','A single Knowledge Assistant, because it can natively coordinate Genie spaces and UC functions.','A code interpreter tool that reimplements all three capabilities in Python.'],a:0,w:'A supervisor is designed to route multi-domain requests to specialists while governed, per-user access prevents unauthorized results.'},es:{q:'Una empresa quiere un sistema que responda preguntas de varios dominios: análisis estructurado mediante un espacio Genie, preguntas y respuestas sobre documentos mediante un endpoint de Knowledge Assistant y una consulta determinista mediante una función de Unity Catalog. Debe enrutar cada solicitud al especialista correcto y nunca devolver resultados de un subagente al que un usuario dado no tenga acceso.\n\n¿Qué enfoque encaja mejor y qué gobierna el acceso?',o:['Un Multi-Agent Supervisor que coordina el espacio Genie, el endpoint de Knowledge Assistant y la función de UC como subagentes, enruta por intención y aplica acceso por usuario para que cada persona reciba resultados solo de subagentes a los que puede acceder.','Una cadena secuencial que siempre llama a los tres subagentes en un orden fijo sin importar la pregunta.','Un único Knowledge Assistant, porque puede coordinar de forma nativa espacios Genie y funciones de UC.','Una herramienta de intérprete de código que reimplementa las tres capacidades en Python.'],a:0,w:'Un supervisor enruta solicitudes de varios dominios a especialistas, mientras el acceso gobernado por usuario evita resultados no autorizados.'}},
      {en:{q:"A developer registers a SQL function as an agent tool that computes the average claim amount for an insurance region.\n\nCREATE OR REPLACE FUNCTION avg_region_claim(\n  region_name STRING COMMENT 'Region to filter by, e.g. Midwest'\n)\nRETURNS DOUBLE\nLANGUAGE SQL\n_______\nCOMMENT 'Returns the average claim amount for a given region.'\nRETURN SELECT AVG(claim_amount) FROM claims WHERE region = region_name\n\nThe team wants the function marked so the engine knows it always returns the same result for the same input, and they want the agent to select it reliably.\n\nWhich choice best completes the definition and explains the practices shown?",o:['Leave the blank empty; the COMMENT clauses have no effect on agent tool selection.','Put DETERMINISTIC in the blank; combined with clear COMMENT clauses on the function and parameter, this helps both the engine and the agent understand and select the tool.','Put PARTITIONED BY (region_name), because agent tools must be partitioned.','Put NONDETERMINISTIC in the blank, because averages change and the comments are only for humans.'],a:1,w:'DETERMINISTIC declares that identical inputs produce identical results, and the comments provide metadata that helps the agent discover and select the tool.'},es:{q:"Un desarrollador registra como herramienta de agente una función SQL que calcula el monto promedio de reclamos para una región de seguros.\n\nCREATE OR REPLACE FUNCTION avg_region_claim(\n  region_name STRING COMMENT 'Region to filter by, e.g. Midwest'\n)\nRETURNS DOUBLE\nLANGUAGE SQL\n_______\nCOMMENT 'Returns the average claim amount for a given region.'\nRETURN SELECT AVG(claim_amount) FROM claims WHERE region = region_name\n\nEl equipo quiere marcar la función para que el motor sepa que siempre devuelve el mismo resultado ante la misma entrada, y desea que el agente pueda seleccionarla de forma fiable.\n\n¿Qué opción completa mejor la definición y explica las prácticas mostradas?",o:['Dejar el espacio vacío; las cláusulas COMMENT no tienen efecto sobre la selección de herramientas del agente.','Colocar DETERMINISTIC en el espacio; combinado con cláusulas COMMENT claras sobre la función y el parámetro, ayuda al motor y al agente a comprender y seleccionar la herramienta.','Colocar PARTITIONED BY (region_name), porque las herramientas de agente deben estar particionadas.','Colocar NONDETERMINISTIC en el espacio, porque los promedios cambian y los comentarios son solo para humanos.'],a:1,w:'DETERMINISTIC declara que entradas idénticas producen resultados idénticos, y los comentarios aportan metadatos que ayudan al agente a descubrir y elegir la herramienta.'}},
      {en:{q:'A platform team has built a set of tools for one agent framework and now wants to reuse the same tools with a different framework and with several client applications, without rewriting integration code for each.\n\nWhich statement best describes what the Model Context Protocol (MCP) provides here?',o:['MCP is a billing layer that meters tool usage per token.','MCP is a Databricks-only storage format for embeddings.','MCP is a fine-tuning technique that teaches the model which tools to call.','MCP is an open standard for connecting agents to tools and context, so a tool built once can be discovered and called by any MCP-compatible agent or client.'],a:3,w:'MCP standardizes the client-server interface for tools and context, allowing interoperable reuse across compatible agents and clients.'},es:{q:'Un equipo de plataforma creó un conjunto de herramientas para un framework de agentes y ahora quiere reutilizar las mismas herramientas con otro framework y varias aplicaciones cliente, sin reescribir el código de integración para cada una.\n\n¿Qué afirmación describe mejor lo que aporta Model Context Protocol (MCP) en este caso?',o:['MCP es una capa de facturación que mide el uso de herramientas por token.','MCP es un formato de almacenamiento exclusivo de Databricks para embeddings.','MCP es una técnica de fine-tuning que enseña al modelo qué herramientas invocar.','MCP es un estándar abierto para conectar agentes con herramientas y contexto, de modo que una herramienta creada una vez puede ser descubierta e invocada por cualquier agente o cliente compatible con MCP.'],a:3,w:'MCP estandariza la interfaz cliente-servidor para herramientas y contexto, permitiendo reutilización interoperable entre agentes y clientes compatibles.'}},
      {en:{q:'A developer chains two agents so the output of the first flows into the second, and wants the second agent to see the full conversation history rather than only the first agent’s final text string.\n\nresult1 = await Runner.run(agent1, user_input)\nresult2 = await Runner.run(agent2, result1._______)\n\nWhat should fill the blank, and why?',o:['final_output, because passing only the final string always carries the full history.','to_input_list(), because it carries the full conversation history forward, not just the final text string.','raw_response, because it contains the model’s tokens.','messages_json, because it serializes the run to disk.'],a:1,w:'to_input_list() preserves the run items needed as the next agent input. final_output contains only the final text.'},es:{q:'Un desarrollador encadena dos agentes para que la salida del primero pase al segundo, y quiere que el segundo vea el historial completo de la conversación, no solo la cadena de texto final del primer agente.\n\nresult1 = await Runner.run(agent1, user_input)\nresult2 = await Runner.run(agent2, result1._______)\n\n¿Qué debe completar el espacio y por qué?',o:['final_output, porque pasar solo la cadena final siempre conserva el historial completo.','to_input_list(), porque transporta el historial completo de conversación, no solo la cadena de texto final.','raw_response, porque contiene los tokens del modelo.','messages_json, porque serializa la ejecución al disco.'],a:1,w:'to_input_list() preserva los elementos de ejecución necesarios como entrada del siguiente agente. final_output contiene únicamente el texto final.'}},
      {en:{q:'An agent for an e-commerce company needs to answer a question that requires running Python to compute a custom statistical calculation on the fly, rather than querying a table or searching documents.\n\nWhich common Databricks agent tool pattern fits this need?',o:['A structured data retrieval tool, because it returns numbers.','An external connection tool, because computation happens outside the model.','A code interpreter tool, which lets the agent run Python for calculations, data analysis, and dynamic processing.','An unstructured data retrieval tool, because the calculation involves text.'],a:2,w:'A code interpreter is intended for dynamic code execution such as Python calculations and data analysis.'},es:{q:'Un agente de una empresa de comercio electrónico debe responder una pregunta que requiere ejecutar Python para calcular una estadística personalizada al vuelo, en lugar de consultar una tabla o buscar documentos.\n\n¿Qué patrón común de herramientas de agentes de Databricks se ajusta a esta necesidad?',o:['Una herramienta de recuperación de datos estructurados, porque devuelve números.','Una herramienta de conexión externa, porque el cálculo ocurre fuera del modelo.','Una herramienta de intérprete de código, que permite al agente ejecutar Python para cálculos, análisis de datos y procesamiento dinámico.','Una herramienta de recuperación de datos no estructurados, porque el cálculo involucra texto.'],a:2,w:'Un intérprete de código está diseñado para ejecución dinámica de código, como cálculos Python y análisis de datos.'}},
      {en:{q:'A developer runs a single agent and needs the final text answer from the run.\n\nresult = await Runner.run(data_analyst_agent, "Is $150 a fair nightly rate?")\nanswer = result._______\nprint(answer)\n\nWhich statement is correct about executing the agent and reading its result?',o:['Runner.run is synchronous, so await is unnecessary and will raise an error.','You must call result.execute() before any output is available.','result is already a plain string, so no attribute access is needed.','Runner.run is async, so it must be awaited, and result.final_output holds the agent’s final text response.'],a:3,w:'Runner.run is asynchronous. Its result object exposes final_output for the final text response.'},es:{q:'Un desarrollador ejecuta un solo agente y necesita la respuesta de texto final de la ejecución.\n\nresult = await Runner.run(data_analyst_agent, "Is $150 a fair nightly rate?")\nanswer = result._______\nprint(answer)\n\n¿Qué afirmación es correcta sobre ejecutar el agente y leer su resultado?',o:['Runner.run es síncrono, por lo que await no es necesario y producirá un error.','Debe llamarse result.execute() antes de que haya alguna salida disponible.','result ya es una cadena de texto simple, por lo que no se necesita acceso a atributos.','Runner.run es asíncrono, por lo que debe esperarse con await, y result.final_output contiene la respuesta final de texto del agente.'],a:3,w:'Runner.run es asíncrono. Su objeto de resultado expone final_output para la respuesta final de texto.'}},
      {en:{q:'A content team needs three workflows. Workflow A runs several independent analyses of the same document at once to reduce latency. Workflow B repeatedly revises a draft, with an evaluator giving explicit feedback each pass until it approves or a max iteration count is hit. Workflow C decomposes a task into an ordered pipeline where each step depends on the previous one.\n\nWhich mapping of orchestration patterns is correct?',o:['A: sequential; B: parallel; C: feedback loop.','A: feedback loop; B: sequential; C: parallel.','A: parallel execution; B: feedback loop; C: sequential chaining.','A: handoffs; B: agents-as-tools; C: parallel.'],a:2,w:'Independent work is parallel, evaluation-driven iteration is a feedback loop, and dependent ordered stages form a sequential chain.'},es:{q:'Un equipo de contenido necesita tres flujos de trabajo. El flujo A ejecuta varios análisis independientes del mismo documento al mismo tiempo para reducir latencia. El flujo B revisa repetidamente un borrador, con un evaluador que da retroalimentación explícita en cada pasada hasta aprobarlo o alcanzar un máximo de iteraciones. El flujo C descompone una tarea en una canalización ordenada en la que cada paso depende del anterior.\n\n¿Qué correspondencia de patrones de orquestación es correcta?',o:['A: secuencial; B: paralelo; C: bucle de retroalimentación.','A: bucle de retroalimentación; B: secuencial; C: paralelo.','A: ejecución paralela; B: bucle de retroalimentación; C: encadenamiento secuencial.','A: delegaciones; B: agentes-como-herramientas; C: paralelo.'],a:2,w:'El trabajo independiente es paralelo, la iteración guiada por evaluación es un bucle de retroalimentación y las etapas ordenadas dependientes forman una cadena secuencial.'}},
      {en:{q:'A team wants to build production agents through a guided, no-code interface on Databricks rather than writing agent orchestration code, and asks which Agent Bricks options exist.\n\nWhich statement correctly describes Agent Bricks?',o:['Agent Bricks is a storage format for agent traces.','Agent Bricks is a Python-only SDK that replaces the OpenAI Agents SDK.','Agent Bricks is a no-code platform offering agent types such as Knowledge Assistant, Supervisor Agent, and Information Extraction, built on Unity Catalog, Model Serving, MLflow, and Agent Evaluation.','Agent Bricks only supports one agent type, a document classifier.'],a:2,w:'Agent Bricks provides managed, guided agent types and is integrated with Databricks governance, serving, tracing, and evaluation capabilities.'},es:{q:'Un equipo quiere crear agentes de producción mediante una interfaz guiada y sin código en Databricks, en vez de escribir código de orquestación, y pregunta qué opciones existen en Agent Bricks.\n\n¿Qué afirmación describe correctamente Agent Bricks?',o:['Agent Bricks es un formato de almacenamiento para trazas de agentes.','Agent Bricks es un SDK solo de Python que sustituye a OpenAI Agents SDK.','Agent Bricks es una plataforma sin código que ofrece tipos de agentes como Knowledge Assistant, Supervisor Agent e Information Extraction, construida sobre Unity Catalog, Model Serving, MLflow y Agent Evaluation.','Agent Bricks solo admite un tipo de agente: un clasificador de documentos.'],a:2,w:'Agent Bricks ofrece tipos de agentes administrados y guiados, integrados con las capacidades de gobernanza, serving, trazas y evaluación de Databricks.'}},
      {en:{q:'A developer builds a supervisor that delegates to two worker agents using the OpenAI Agents SDK.\n\nsupervisor = Agent(\n    name="Supervisor",\n    instructions="Route requests to the right specialist.",\n    handoffs=[claims_agent, billing_agent]\n)\n\nThe developer looks for where the transfer_to_claims_agent and transfer_to_billing_agent tools are defined and cannot find them.\n\nWhat is the correct explanation?',o:['The developer must manually write each transfer_to_* tool as a Python function.','Handoffs are not supported unless every worker shares one MCP server.','The tools must be registered to Unity Catalog before handoffs will work.','The SDK auto-generates a transfer_to_{agent_name} handoff tool from the handoffs list, so the supervisor’s LLM can route by calling them.'],a:3,w:'The handoffs list declaratively creates the transfer tools; developers do not implement each generated transfer function manually.'},es:{q:'Un desarrollador crea un supervisor que delega en dos agentes trabajadores mediante OpenAI Agents SDK.\n\nsupervisor = Agent(\n    name="Supervisor",\n    instructions="Route requests to the right specialist.",\n    handoffs=[claims_agent, billing_agent]\n)\n\nEl desarrollador busca dónde se definen las herramientas transfer_to_claims_agent y transfer_to_billing_agent, pero no las encuentra.\n\n¿Cuál es la explicación correcta?',o:['El desarrollador debe escribir manualmente cada herramienta transfer_to_* como una función Python.','Las delegaciones no son compatibles a menos que cada trabajador comparta un servidor MCP.','Las herramientas deben registrarse en Unity Catalog antes de que funcionen las delegaciones.','El SDK genera automáticamente una herramienta de delegación transfer_to_{agent_name} a partir de la lista handoffs, para que el LLM del supervisor pueda enrutar llamándolas.'],a:3,w:'La lista handoffs crea declarativamente las herramientas de transferencia; no se implementa manualmente cada función generada.'}},
      {en:{q:'A developer wraps a Python function with the OpenAI Agents SDK @function_tool decorator so an agent can call it.\n\nfrom agents import function_tool\n\n@function_tool\ndef get_inventory(sku: str) -> int:\n    """Return the on-hand quantity for a product SKU."""\n    ...\n\nHow does the SDK determine the tool schema the LLM sees?',o:['The LLM infers the schema at random on each call.','The developer must write a separate JSON schema by hand and pass it to the agent.','The decorator derives the schema from the function’s name, type hints, and docstring, so clear names and docstrings improve tool selection.','The schema is generated only after the tool is registered to Unity Catalog.'],a:2,w:'@function_tool uses the function signature and documentation to generate the schema exposed to the model.'},es:{q:'Un desarrollador envuelve una función Python con el decorador @function_tool de OpenAI Agents SDK para que un agente pueda invocarla.\n\nfrom agents import function_tool\n\n@function_tool\ndef get_inventory(sku: str) -> int:\n    """Return the on-hand quantity for a product SKU."""\n    ...\n\n¿Cómo determina el SDK el esquema de herramienta que ve el LLM?',o:['El LLM infiere el esquema al azar en cada llamada.','El desarrollador debe escribir manualmente un esquema JSON separado y pasarlo al agente.','El decorador deriva el esquema del nombre de la función, las anotaciones de tipo y el docstring; por eso nombres y docstrings claros mejoran la selección de herramientas.','El esquema se genera únicamente después de registrar la herramienta en Unity Catalog.'],a:2,w:'@function_tool usa la firma y la documentación de la función para generar el esquema que se expone al modelo.'}},
      {en:{q:'A developer wants the OpenAI Agents SDK to route model calls through Databricks model serving instead of the public OpenAI API, and to use MLflow for tracing instead of the SDK’s built-in trace processor.\n\nfrom agents import set_default_openai_api, set_default_openai_client\nfrom agents.tracing import set_trace_processors\nfrom databricks_openai import AsyncDatabricksOpenAI\n\nset_default_openai_client(_______)\nset_default_openai_api("chat_completions")\nset_trace_processors([])\n\nWhat belongs in the blank to route the SDK through Databricks?',o:['AsyncDatabricksOpenAI(), which configures the SDK to use Databricks model routing.','OpenAI(api_key="sk-..."), which points at the public OpenAI API.','mlflow.openai.autolog(), which enables tracing but does not set the client.','DatabricksMCPClient(), which is for calling MCP tools, not routing model calls.'],a:0,w:'AsyncDatabricksOpenAI provides the OpenAI-compatible client configured for Databricks Model Serving; tracing configuration is a separate concern.'},es:{q:'Un desarrollador quiere que OpenAI Agents SDK enrute las llamadas de modelo mediante Databricks Model Serving en lugar de la API pública de OpenAI, y usar MLflow para las trazas en vez del procesador de trazas incorporado del SDK.\n\nfrom agents import set_default_openai_api, set_default_openai_client\nfrom agents.tracing import set_trace_processors\nfrom databricks_openai import AsyncDatabricksOpenAI\n\nset_default_openai_client(_______)\nset_default_openai_api("chat_completions")\nset_trace_processors([])\n\n¿Qué va en el espacio para enrutar el SDK mediante Databricks?',o:['AsyncDatabricksOpenAI(), que configura el SDK para usar el enrutamiento de modelos de Databricks.','OpenAI(api_key="sk-..."), que apunta a la API pública de OpenAI.','mlflow.openai.autolog(), que habilita trazas, pero no configura el cliente.','DatabricksMCPClient(), que sirve para invocar herramientas MCP, no para enrutar llamadas de modelo.'],a:0,w:'AsyncDatabricksOpenAI proporciona el cliente compatible con OpenAI configurado para Databricks Model Serving; las trazas se configuran por separado.'}},
      {en:{q:'A media company must ship a standard document question-answering assistant quickly, with managed optimization and built-in evaluation and minimal agent code. A separate team needs a highly customized multi-step orchestration with bespoke tool logic and full control over the agent loop.\n\nWhich choice fits each team best?',o:['First team: Agent Bricks (no-code, managed optimization, built-in evaluation); second team: a code-first framework for full control over orchestration and custom tools.','First team: code-first OpenAI Agents SDK; second team: Agent Bricks.','Both teams should use Agent Bricks, since code-first frameworks are unsupported on Databricks.','Both teams should hand-write custom OpenAI Agents SDK code, since Agent Bricks cannot evaluate agents.'],a:0,w:'Agent Bricks fits managed, standard use cases with low code; code-first frameworks fit bespoke orchestration where the team needs full control.'},es:{q:'Una empresa de medios debe entregar rápidamente un asistente estándar de preguntas y respuestas sobre documentos, con optimización administrada, evaluación incorporada y poco código de agente. Otro equipo necesita una orquestación de varios pasos muy personalizada, con lógica de herramientas a medida y control total sobre el ciclo del agente.\n\n¿Qué opción se ajusta mejor a cada equipo?',o:['Primer equipo: Agent Bricks (sin código, optimización administrada, evaluación incorporada); segundo equipo: un framework code-first para control total sobre la orquestación y las herramientas personalizadas.','Primer equipo: OpenAI Agents SDK code-first; segundo equipo: Agent Bricks.','Ambos equipos deben usar Agent Bricks, ya que los frameworks code-first no son compatibles con Databricks.','Ambos equipos deben escribir código personalizado de OpenAI Agents SDK, ya que Agent Bricks no puede evaluar agentes.'],a:0,w:'Agent Bricks se ajusta a casos estándar administrados con poco código; los frameworks code-first se ajustan a orquestación a medida que necesita control total.'}},
      {en:{q:'A developer wants an agent to discover and call all the Unity Catalog functions registered in the finance.tools schema through a Databricks managed MCP server.\n\nmcp_url = f"{workspace_host}/api/2.0/mcp/_______/finance/tools"\nmcp_client = DatabricksMCPClient(server_url=mcp_url, workspace_client=ws)\ntools = mcp_client.list_tools()\n\nWhat belongs in the blank so the URL points at the managed MCP server for Unity Catalog functions in that schema?',o:['The path segment should be sql, giving /api/2.0/mcp/sql/finance/tools.','The path segment should be genie, giving /api/2.0/mcp/genie/finance/tools.','The path segment should be models, giving /api/2.0/mcp/models/finance/tools.','The path segment should be functions, giving /api/2.0/mcp/functions/finance/tools.'],a:3,w:'The managed MCP endpoint for Unity Catalog functions uses the functions path segment, followed by catalog and schema.'},es:{q:'Un desarrollador quiere que un agente descubra e invoque todas las funciones de Unity Catalog registradas en el esquema finance.tools mediante un servidor MCP administrado por Databricks.\n\nmcp_url = f"{workspace_host}/api/2.0/mcp/_______/finance/tools"\nmcp_client = DatabricksMCPClient(server_url=mcp_url, workspace_client=ws)\ntools = mcp_client.list_tools()\n\n¿Qué debe ir en el espacio para que la URL apunte al servidor MCP administrado para funciones de Unity Catalog en ese esquema?',o:['El segmento de ruta debe ser sql, dando /api/2.0/mcp/sql/finance/tools.','El segmento de ruta debe ser genie, dando /api/2.0/mcp/genie/finance/tools.','El segmento de ruta debe ser models, dando /api/2.0/mcp/models/finance/tools.','El segmento de ruta debe ser functions, dando /api/2.0/mcp/functions/finance/tools.'],a:3,w:'El endpoint MCP administrado para funciones de Unity Catalog usa el segmento functions, seguido del catálogo y el esquema.'}},
      {en:{q:'A team is deciding between two OpenAI Agents SDK patterns. In pattern one, a triage agent transfers the conversation to a specialist that then responds directly to the user. In pattern two, a manager agent calls specialists, keeps control, and synthesizes their outputs into one final answer it owns.\n\nWhich mapping is correct?',o:['Both patterns are sequential chaining, since agents run one after another.','Pattern one is handoffs (the specialist takes over the conversation); pattern two is agents-as-tools (the manager retains control and synthesizes results).','Both patterns are handoffs, since both involve multiple agents.','Pattern one is agents-as-tools; pattern two is handoffs.'],a:1,w:'A handoff transfers the active conversation to the specialist. With agents-as-tools, the manager remains the active agent and synthesizes tool results.'},es:{q:'Un equipo decide entre dos patrones de OpenAI Agents SDK. En el patrón uno, un agente de triaje transfiere la conversación a un especialista que responde directamente al usuario. En el patrón dos, un agente administrador llama a especialistas, conserva el control y sintetiza sus salidas en una respuesta final de su propiedad.\n\n¿Qué correspondencia es correcta?',o:['Ambos patrones son encadenamiento secuencial, porque los agentes se ejecutan uno después de otro.','El patrón uno son delegaciones (el especialista toma la conversación); el patrón dos son agentes-como-herramientas (el administrador conserva el control y sintetiza los resultados).','Ambos patrones son delegaciones, porque ambos involucran varios agentes.','El patrón uno son agentes-como-herramientas; el patrón dos son delegaciones.'],a:1,w:'Una delegación transfiere la conversación activa al especialista. Con agentes-como-herramientas, el administrador sigue siendo el agente activo y sintetiza los resultados.'}},
      {en:{q:'An agent for a healthcare provider must handle three kinds of requests: open-ended analytical questions over governed structured tables (for example, “which clinics had the most no-shows last quarter”), retrieval over a large collection of policy PDFs, and a fixed, parameterized lookup of a patient record by ID.\n\nWhich mapping of Databricks managed MCP servers is most appropriate?',o:['Use the SQL managed server for all three, since everything is ultimately SQL.','Use a Knowledge Assistant for the structured questions and a Genie space for the PDFs.','Use a Unity Catalog function for all three, since UC governs everything.','Use a Genie space for the open-ended structured questions, an AI Search index for the PDF retrieval, and a Unity Catalog function for the fixed parameterized lookup.'],a:3,w:'Genie handles open-ended governed analytics, AI Search supports document retrieval, and a UC function is appropriate for a fixed parameterized lookup.'},es:{q:'Un agente para un proveedor de salud debe manejar tres clases de solicitudes: preguntas analíticas abiertas sobre tablas estructuradas gobernadas (por ejemplo, “qué clínicas tuvieron más ausencias el último trimestre”), recuperación sobre una gran colección de PDF de políticas y una búsqueda fija y parametrizada de un expediente de paciente por ID.\n\n¿Qué correspondencia de servidores MCP administrados de Databricks es la más apropiada?',o:['Usar el servidor administrado SQL para los tres, ya que todo es finalmente SQL.','Usar un Knowledge Assistant para las preguntas estructuradas y un espacio Genie para los PDF.','Usar una función de Unity Catalog para los tres, ya que UC gobierna todo.','Usar un espacio Genie para las preguntas estructuradas abiertas, un índice AI Search para la recuperación de PDF y una función de Unity Catalog para la búsqueda fija parametrizada.'],a:3,w:'Genie maneja análisis abiertos gobernados, AI Search permite recuperación documental y una función UC es adecuada para una búsqueda fija parametrizada.'}}
    ];
    let index=0,lang='en';const $=s=>document.querySelector(s);const t=(en,es)=>lang==='es'?es:en;const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){const q=data[index][lang],total=data.length;$('#subtitle').textContent=t(`${total} documented questions of the ${total}-question exam`,`${total} preguntas documentadas del examen de ${total}`);$('#back').textContent=t('← Back to quiz center','← Volver al centro de quizzes');$('#search').placeholder=t(`Search the ${total} recorded questions…`,`Buscar entre las ${total} preguntas registradas…`);$('#status').textContent=t(`Question ${index+1} of ${total}`,`Pregunta ${index+1} de ${total}`);$('#quiz').innerHTML=`<div class="card-head">${t('Question','Pregunta')} ${index+1} ${t('of','de')} ${total}</div><div class="body"><p class="prompt">${esc(q.q)}</p>${q.o.map((o,i)=>`<div class="choice ${i===q.a?'correct':''}"><input type="radio" disabled ${i===q.a?'checked':''}><span>${esc(o)}</span>${i===q.a?`<span class="mark">${t('Correct','Correcta')}</span>`:''}</div>`).join('')}<div class="note"><b>${t('Justification','Justificación')}:</b> ${esc(q.w)}</div><div class="nav"><button id="prev" ${index===0?'disabled':''}>${t('Previous','Anterior')}</button><button id="next" class="primary" ${index===data.length-1?'disabled':''}>${t('Next','Siguiente')}</button></div></div>`;$('#prev').onclick=()=>{index--;render()};$('#next').onclick=()=>{index++;render()}}
    $('#search').addEventListener('input',e=>{const s=e.target.value.toLowerCase().trim(),hits=s?data.map((q,i)=>({q,i})).filter(({q})=>(q.en.q+' '+q.es.q+' '+q.en.o.join(' ')+' '+q.es.o.join(' ')).toLowerCase().includes(s)):[];$('#matches').innerHTML=hits.map(({q,i})=>`<button data-i="${i}">${t('Question','Pregunta')} ${i+1}: ${esc(q[lang].q.split('\n')[0])}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{index=+b.dataset.i;$('#matches').innerHTML='';$('#search').value='';render()})});
    document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===b));render()});render();
  </script>
